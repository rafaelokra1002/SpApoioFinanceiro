    <script>
      // Aplica o tema antes do primeiro paint, senão o modo escuro pisca branco no load.
      // Deve espelhar a chave e o padrão de src/hooks/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('sp-admin-theme');
          var dark = saved === 'dark'
            || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* localStorage bloqueado: segue no claro */ }
      })();
    </script>
